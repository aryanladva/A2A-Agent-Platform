apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a2a-ingress
  namespace: a2a-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  rules:
    - host: a2a.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 4000
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 4000
          - path: /a2a
            pathType: Prefix
            backend:
              service:
                name: orchestrator-service
                port:
                  number: 4100
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: orchestrator-service
                port:
                  number: 4100
