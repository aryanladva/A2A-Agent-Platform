apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: a2a-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/a2a-platform/orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
          envFrom:
            - configMapRef:
                name: a2a-config
            - secretRef:
                name: a2a-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /.well-known/agent.json
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.well-known/agent.json
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: a2a-system
spec:
  type: ClusterIP
  ports:
    - port: 4100
      targetPort: 4100
  selector:
    app: orchestrator
