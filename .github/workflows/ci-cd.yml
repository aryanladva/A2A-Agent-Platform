name: A2A Platform CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-validate:
    name: Run TESTING.md Suite & Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: a2a_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Formatting Check
        run: pnpm format:check

      - name: ESLint Check
        run: pnpm lint

      - name: TypeScript Build Check
        run: pnpm build

      - name: Run Unit Tests (TESTING.md)
        run: pnpm test

      - name: Run Integration Tests (TESTING.md)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/a2a_test_db
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration

  build-and-deploy:
    name: Build Docker Images & Deploy to Kubernetes
    needs: test-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:latest

      - name: Build & Push Orchestrator Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/orchestrator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/orchestrator:latest

      - name: Build & Push Agent Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/agent-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/agent-worker:latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest

      - name: Deploy Manifests to Kubernetes Cluster
        uses: azure/k8s-deploy@v5
        with:
          manifests: |
            k8s/namespace.yaml
            k8s/configmap.yaml
            k8s/secret.yaml
            k8s/postgres.yaml
            k8s/redis.yaml
            k8s/gateway-deployment.yaml
            k8s/orchestrator-deployment.yaml
            k8s/agent-worker-deployment.yaml
            k8s/frontend-deployment.yaml
            k8s/ingress.yaml
          namespace: a2a-system
