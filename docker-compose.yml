# Docker Compose configuration for A2A Execution Sandbox
# Note: Postgres and Redis have been replaced with embedded SQLite and an in-process async queue.
# Docker is used exclusively for isolated execution sandboxing.

services:
  sandbox:
    image: node:20-alpine
    container_name: a2a-execution-sandbox
    working_dir: /workspace
    command: tail -f /dev/null
    network_mode: none # Isolated sandbox environment
